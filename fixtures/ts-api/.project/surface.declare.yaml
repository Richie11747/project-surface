# Maintainer declarations for the fixture. The first constraint is violated on
# purpose (src/checkout/create.ts imports the provider), so that the golden
# snapshot and the CLI tests exercise a real CONSTRAINT_VIOLATED finding.

constraints:
  - id: no-provider-in-handlers
    rule: Never call the payment provider from a request handler.
    rationale: Handlers must stay idempotent; provider calls go through the job queue.
    severity: warn
    check:
      kind: forbid-import
      from: [src/checkout/**, src/auth/**]
      to: [src/payments/**, stripe, "@stripe/*"]

  - id: no-committed-env
    rule: Never commit a filled-in .env file.
    severity: error
    check:
      kind: forbid-file
      paths: [".env", "**/.env", "**/.env.local"]

  - id: handlers-need-tests
    rule: Every route handler has a test that imports it.
    severity: warn
    check:
      kind: require-test
      paths: [src/checkout/**, src/auth/**]

  - id: provider-key-stays-in-payments
    rule: The payment provider key is read only by the payments module.
    rationale: One place to rotate, one place to audit.
    severity: error
    check:
      kind: forbid-env
      names: [PAYMENT_PROVIDER_KEY, "STRIPE_*"]
      paths: [src/payments/**]

  - id: one-file-per-handler
    rule: A handler capability is a single file.
    severity: warn
    check:
      kind: max-owners
      limit: 1
      paths: [src/checkout/**, src/auth/**]
