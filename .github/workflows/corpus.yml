name: Corpus

# The tool against real repositories, weekly and on demand. Results are
# committed so the claim "works on real repos" has a date and a table.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: node bench/corpus-run.mjs
        timeout-minutes: 30
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/corpus/RESULTS.md
          git diff --cached --quiet || git commit -m "Corpus run $(date -u +%Y-%m-%d)"
          git push
