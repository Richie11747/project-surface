name: Demo

# Records docs/demo/demo.gif from docs/demo/demo.tape with a real build of the
# CLI on a fresh copy of fixtures/ts-api, and commits it. The GIF in the README
# is therefore an artefact of the current code, not a screenshot from months
# ago - the same rule the README applies to every transcript. Run it from the
# Actions tab after a change that alters the demo output.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: charmbracelet/vhs-action@v2
        with:
          install-only: true

      # The action ships a nightly static ffmpeg with which vhs 0.12 prints
      # "Creating x.gif..." and writes nothing (exit 0). The distribution's
      # ffmpeg is put in front of it, and a one-line control tape proves the
      # pipeline works before the real recording spends a minute.
      - name: Recording toolchain
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q ffmpeg >/dev/null
          sudo cp /usr/bin/ffmpeg "$(dirname "$(command -v ffmpeg)")/ffmpeg" || true
          vhs --version
          ttyd --version
          ffmpeg -version | head -1
          printf 'Output control.gif\nType "echo hello"\nEnter\nSleep 1s\n' > /tmp/control.tape
          (cd /tmp && vhs control.tape 2>&1; echo "vhs exit=$?"; ls -l /tmp/control.gif)

      - name: Put surface on PATH
        run: |
          printf '#!/bin/sh\nexec node "%s/packages/cli/dist/index.js" "$@"\n' "$GITHUB_WORKSPACE" | sudo tee /usr/local/bin/surface > /dev/null
          sudo chmod +x /usr/local/bin/surface
          surface --version

      - name: Record on a fresh copy of the fixture
        run: |
          demo=$(mktemp -d)
          cp -r fixtures/ts-api/. "$demo"
          rm -f "$demo/expected.surface.json"
          (cd "$demo" && git init -q && git add -A && git -c user.name=demo -c user.email=demo@example.com commit -qm "fixture")
          # The output path is given explicitly and absolutely; the tape's own
          # `Output` line serves local runs.
          cp docs/demo/demo.tape "$demo/demo.tape"
          (cd "$demo" && vhs demo.tape -o "$GITHUB_WORKSPACE/docs/demo/demo.gif" 2>&1; echo "vhs exit=$?")
          ls -la "$demo" docs/demo
          ls -l docs/demo/demo.gif

      - name: Commit the recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo/demo.gif
          git diff --cached --quiet || git commit -m "Re-record the demo"
          git push
