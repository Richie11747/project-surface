name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # The embedded schema module must match the normative spec file.
      - name: Schema is in sync with the spec
        run: node scripts/gen-schema-module.mjs --check

      - run: npm test

      # The benchmark scorer is offline; the committed results must match the recordings.
      - name: Benchmark results are current
        run: node bench/score.mjs --check

  surface:
    name: self-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - run: npm run build

      # project-surface describes itself. The declarations in
      # .project/surface.declare.yaml set the scope; verify turns the test
      # suite into evidence; doctor --strict fails on any warning, so a claim
      # this repository makes about itself cannot go stale unnoticed.
      - name: Generate this repository surface
        run: node packages/cli/dist/index.js init

      - name: Prove it
        run: node packages/cli/dist/index.js verify --command test --command typecheck --timeout 900

      - name: Report drift
        run: node packages/cli/dist/index.js doctor --strict

      - name: Show the result
        run: node packages/cli/dist/index.js map

  # On pull requests, the repository's own Action posts what changed about the
  # surface - the same comment any consumer of the Action gets.
  surface-comment:
    name: pull request comment
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: ./integrations/github-action
        with:
          run: node packages/cli/dist/index.js
          comment: "true"
