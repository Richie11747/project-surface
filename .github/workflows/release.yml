name: Release

# A tag v* builds, tests, packs every publishable workspace, attaches the
# tarballs and a CycloneDX SBOM to a GitHub Release with the matching
# CHANGELOG section as its notes - and then stops. Publishing to npm is a
# separate job behind the `npm` environment: nothing reaches the registry
# until a required reviewer approves that job in the Actions UI. The
# environment must exist in the repository settings with a required reviewer
# and an NPM_TOKEN secret (automation token); without it the publish job fails
# closed rather than open.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build, test, pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/gen-schema-module.mjs --check
      - run: npm test
      - run: node bench/score.mjs --check

      - name: The tag must name the version in package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "tag $GITHUB_REF does not match package.json version $version" >&2
            exit 1
          fi

      - name: Pack every publishable workspace
        run: |
          mkdir -p dist-release
          for w in packages/core packages/adapter-sdk packages/adapters/typescript packages/adapters/python \
                   packages/adapters/go packages/adapters/rust packages/adapters/generic packages/mcp-server packages/cli; do
            npm pack -w "$w" --pack-destination dist-release
          done
          ls -l dist-release

      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx --omit dev > dist-release/sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist-release
          if-no-files-found: error

  release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist-release

      # The notes are the CHANGELOG section for this version, verbatim: one
      # place to write release notes, and the release cannot drift from it.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.build.outputs.version }}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for ${{ needs.build.outputs.version }}" >&2; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-release/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag

  publish:
    name: npm publish (gated)
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/project-surface
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # Private workspaces (bench) are skipped by npm itself. Provenance ties
      # each package to this workflow run and commit on the registry page.
      - name: Publish every public workspace
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspaces --access public --provenance
